[package]
name = "seeker_core"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
anyhow = "1.0.104"
bms-rs = { version = "1.0.0", features = ["bmson"] }
bytes = "1.12.1"
chardetng = "1.0.0"
chrono = { version = "0.4.45", features = ["alloc"] }
directories = "6.0.0"
encoding_rs = "0.8.35"
filetime = "0.2.29"
flate2 = "1.1.9"
fs_extra = "1.3.0"
hex = "0.4.3"
md5 = "0.8.1"
regex = "1.13.1"
reqwest = { version = "0.13.4", features = ["blocking", "json"] }
rusqlite = "0.40.1"
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sevenz-rust = "0.6.1"
sha2 = "0.11.0"
tempfile = "3.27.0"
time = "0.3.55"
unrar = "0.5.8"
url = "2.5.8"
walkdir = "2.5.0"
zip = { version = "8.6.0", features = ["nt-time"]}
